<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/static/page-transition.css?v=20260814-1"><title>报销单生成</title>
<style data-app-style="reimbursement">
:root{--ink:#181816;--muted:#77736b;--line:#d3cec4;--paper:#f8f6f1;--bg:#e8e4dc;--accent:#cf432d;--soft:#efebe3;--danger:#b9362d}*{box-sizing:border-box}body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(24,24,22,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(24,24,22,.025) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}body::before{content:"";position:fixed;inset:0 auto 0 0;width:7px;background:var(--accent);z-index:40}.shell{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:32px 0 68px}.top-nav{display:flex;gap:5px;padding:5px;margin-bottom:36px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.top-nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-size:13px;border-radius:5px;white-space:nowrap}.top-nav a:hover{color:var(--ink);background:#e8e3da}.top-nav a.is-active{color:var(--paper);background:var(--ink)}.hero{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;margin-bottom:22px}.mark{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--line);background:var(--soft);color:var(--accent);font-size:25px;border-radius:7px}h1{margin:0;font-size:27px;letter-spacing:0}.hero p{margin:5px 0 0;color:var(--muted);font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;border:1px solid var(--line);background:var(--paper)}.upload{min-height:332px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:34px;border-right:1px solid var(--line);text-align:center}.drop{width:100%;max-width:520px;padding:42px 24px;border:1.5px dashed #9b978f;background:#fffdf8;cursor:pointer}.drop:hover,.drop.drag{border-color:var(--accent);background:#fffaf3}.drop strong{display:block;font-size:16px}.drop span{display:block;margin-top:8px;color:var(--muted);font-size:13px}input{display:none}button{font:inherit;cursor:pointer}.primary{margin-top:17px;padding:10px 18px;border:0;border-radius:5px;background:var(--accent);color:#fff;font-size:14px;font-weight:700}.primary:disabled{opacity:.52;cursor:wait}.details{padding:25px}.details h2{margin:0 0 15px;font-size:15px}.details dl{margin:0}.details div{padding:12px 0;border-top:1px solid var(--line)}.details dt{color:var(--muted);font-size:12px}.details dd{margin:5px 0 0;font-size:13px;line-height:1.55}.status{min-height:22px;margin:16px 0 0;color:var(--muted);font-size:13px}.status.error{color:var(--danger)}.name{margin-top:13px;font-size:13px;word-break:break-all}.result{margin-top:18px;padding:16px 18px;border-left:3px solid var(--accent);background:var(--paper);font-size:14px}.result[hidden]{display:none}@media(max-width:720px){.shell{width:min(100% - 24px,1040px);padding-top:18px}.top-nav{overflow-x:auto;margin-bottom:26px}.workspace{grid-template-columns:1fr}.upload{min-height:285px;border-right:0;border-bottom:1px solid var(--line)}h1{font-size:23px}}
.shell{width:min(1080px,calc(100% - 48px));padding:54px 0 80px}.top-nav{gap:6px;margin-bottom:32px;border-color:var(--ink);border-radius:0;box-shadow:5px 5px 0 rgba(24,24,22,.08)}.top-nav a{border-radius:0;font-size:12px;font-weight:700;letter-spacing:.04em;transition:color .18s ease,background-color .18s ease,transform .14s cubic-bezier(.23,1,.32,1)}.top-nav a:active{transform:translateY(1px) scale(.985)}@media(max-width:720px){.shell{width:min(100% - 24px,1080px);padding:24px 0 80px}}

.top-nav a{border-radius:0;font-size:12px;font-weight:700;letter-spacing:.04em;transition:color .18s ease,background-color .18s ease,transform .14s cubic-bezier(.23,1,.32,1)}

</style></head><body class="page-transition"><main class="shell"><nav class="top-nav" aria-label="业务模块"><a href="/">发票核验</a><a href="/jira">Jira 数据处理</a><a href="/weekly-report">周报生成</a><a class="is-active" href="/reimbursement">报销单生成</a></nav><section id="route-content" class="route-content"><header class="hero"><div class="mark" aria-hidden="true">￥</div><div><h1>报销单生成</h1><p>上传报销信息 DOCX，生成可打印、可检索的费用报销单 PDF。</p></div></header><section class="workspace"><div class="upload"><label class="drop" id="drop" for="file"><strong>选择报销信息 DOCX</strong><span>支持将文件拖放到这里，最大 10 MB</span></label><input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div class="name" id="name"></div><button class="primary" id="generate" disabled>生成 PDF</button><div class="status" id="status" role="status"></div></div><aside class="details"><h2>输出内容</h2><dl><div><dt>表单字段</dt><dd>报销人、部门、日期、报销编号与立项号。</dd></div><div><dt>报销明细</dt><dd>自动读取类型、用途和金额，超过四条时续页。</dd></div><div><dt>多张报销单</dt><dd>一个文档含多张报销单时，自动生成 ZIP 下载包。</dd></div><div><dt>数据处理</dt><dd>文件只在生成期间保存在临时目录。</dd></div></dl></aside></section><div class="result" id="result" hidden>PDF 已生成，下载将立即开始。</div></section></main><script src="/static/page-transition.js?v=20260811-3"></script><script>(()=>{const input=document.querySelector('#file'),zone=document.querySelector('#drop'),name=document.querySelector('#name'),button=document.querySelector('#generate'),status=document.querySelector('#status'),result=document.querySelector('#result');let selected;function set(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.docx')){status.textContent='请选择 DOCX 格式的报销信息文件。';status.className='status error';return}selected=file;name.textContent=file.name;button.disabled=false;status.textContent='';status.className='status';result.hidden=true}input.addEventListener('change',()=>set(input.files[0]));['dragenter','dragover'].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.add('drag')}));['dragleave','drop'].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.remove('drag')}));zone.addEventListener('drop',event=>set(event.dataTransfer.files[0]));button.addEventListener('click',async()=>{if(!selected)return;button.disabled=true;status.className='status';status.textContent='正在解析报销信息并绘制 PDF…';const data=new FormData();data.append('file',selected);try{const response=await fetch('/api/reimbursement/generate',{method:'POST',body:data});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.detail||'生成失败')}const validation=response.headers.get('x-reimbursement-validation');if(validation!=='passed')throw new Error('整体核验未通过，未生成下载文件');const count=Number(response.headers.get('x-reimbursement-count')||1);const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;const disposition=response.headers.get('content-disposition')||'',filenameMatch=disposition.match(/filename\*=utf-8''([^;]+)/i);link.download=filenameMatch?decodeURIComponent(filenameMatch[1]):count>1?'报销单.zip':'报销单.pdf';link.click();URL.revokeObjectURL(url);status.textContent='';result.textContent=count>1?`已生成 ${count} 张报销单，下载将立即开始。`:'PDF 已生成，整体核验通过，下载将立即开始。';result.hidden=false}catch(error){status.textContent=error.message;status.className='status error'}finally{button.disabled=false}})})();</script></body></html>
