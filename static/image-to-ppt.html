<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/page-transition.css?v=20260814-1">
  <title>图片转 PPT · 本地工具</title>
  <style data-app-style="image-ppt">
    :root { --ink:#17212b; --muted:#64717d; --line:#d7e0e8; --paper:#fff; --bg:#f3f7fa; --accent:#11a9c8; --accent-dark:#087d98; --good:#0e8a61; --warn:#b45309; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font-family:"Microsoft YaHei",Arial,sans-serif; } body::before { content:""; position:fixed; inset:0 auto 0 0; width:6px; background:var(--accent); }
    .shell { width:min(1080px,calc(100% - 44px)); margin:auto; padding:42px 0 70px; } .top-nav { display:flex; gap:6px; overflow:auto; margin-bottom:35px; padding:5px; border:1px solid var(--line); background:var(--paper); }
    .top-nav a { flex:none; padding:9px 13px; text-decoration:none; color:var(--muted); font-size:13px; } .top-nav a:hover { color:var(--ink); background:#edf7f9; } .top-nav a.is-active { color:#fff; background:var(--accent-dark); }
    .hero { display:flex; gap:16px; align-items:center; margin-bottom:24px; } .mark { display:grid; place-items:center; width:50px; height:50px; color:var(--accent-dark); font-size:24px; background:#e7f8fb; border:1px solid #bce7ef; } h1 { margin:0; font-size:28px; } .hero p { margin:6px 0 0; color:var(--muted); font-size:14px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 300px; border:1px solid var(--line); background:var(--paper); } .upload { display:flex; min-height:332px; flex-direction:column; justify-content:center; align-items:center; padding:34px; border-right:1px solid var(--line); text-align:center; }
    .drop { width:min(100%,560px); padding:42px 24px; border:2px dashed #9dccd7; background:#f9feff; cursor:pointer; } .drop.drag { border-color:var(--accent-dark); background:#ecfbfe; } .drop strong { display:block; font-size:17px; } .drop span { display:block; margin-top:8px; color:var(--muted); font-size:13px; } input { display:none; } button { font:inherit; cursor:pointer; }
    .primary { margin-top:18px; padding:11px 19px; border:0; background:var(--accent-dark); color:#fff; font-weight:700; } .primary:disabled { opacity:.5; cursor:wait; } .file-name,.status { min-height:21px; margin-top:13px; color:var(--muted); font-size:13px; word-break:break-all; } .status.error { color:#b42318; }
    .details { padding:26px; } .details h2 { margin:0 0 14px; font-size:16px; } .details div { padding:13px 0; border-top:1px solid var(--line); } .details strong { display:block; font-size:13px; } .details span { display:block; margin-top:5px; color:var(--muted); font-size:12px; line-height:1.55; }
    .result { margin-top:20px; padding:22px; border:1px solid var(--line); background:var(--paper); } .result[hidden] { display:none; } .result-head { display:flex; justify-content:space-between; gap:16px; align-items:center; } .result h2 { margin:0; font-size:18px; } .score { color:var(--good); font-weight:700; } .score.warn { color:var(--warn); } .checks { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px; } .check { padding:13px; border:1px solid var(--line); font-size:13px; } .check span { display:block; margin-top:5px; color:var(--muted); font-size:12px; line-height:1.45; } .pass { color:var(--good); } .fail { color:#b42318; }.download { display:inline-block; margin-top:18px; padding:10px 16px; background:var(--accent-dark); color:#fff; text-decoration:none; font-size:14px; font-weight:700; }
    @media(max-width:720px) { .shell { width:min(100% - 24px,1080px); padding-top:22px; } .workspace { grid-template-columns:1fr; } .upload { min-height:285px; border-right:0; border-bottom:1px solid var(--line); } .checks { grid-template-columns:1fr 1fr; } h1 { font-size:23px; } }
  </style>
</head>
<body class="page-transition"><main class="shell">
  <nav class="top-nav" aria-label="业务模块"><a href="/">发票核验</a><a href="/jira">Jira 数据处理</a><a href="/weekly-report">周报生成</a><a href="/reimbursement">报销单生成</a><a class="is-active" href="/image-to-ppt">图片转 PPT</a></nav>
  <section id="route-content" class="route-content">
    <header class="hero"><div class="mark" aria-hidden="true">▣</div><div><h1>图片转 PPT</h1><p>识别架构图中的文本和容器，并重建为可在 PowerPoint 中编辑的文本框与图形对象。</p></div></header>
    <section class="workspace"><div class="upload"><label class="drop" id="drop" for="file"><strong>选择参考图片</strong><span>支持 PNG、JPG、JPEG、WEBP，最大 20 MB</span></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><div class="file-name" id="name"></div><button class="primary" id="generate" disabled>生成可编辑 PPT</button><div class="status" id="status" role="status"></div></div><aside class="details"><h2>生成规则</h2><div><strong>可编辑文字</strong><span>中文 OCR 识别的每段文字都会成为独立文本框。</span></div><div><strong>可编辑图形</strong><span>识别到的信息卡与容器将重建为 PowerPoint 形状。</span></div><div><strong>核验内容</strong><span>页数、画布比例、文本覆盖、对象类型和几何布局。</span></div><div><strong>数据处理</strong><span>文件仅保存在本地临时目录，1 小时后清理。</span></div></aside></section>
    <section class="result" id="result" hidden><div class="result-head"><h2>生成核验</h2><strong id="score" class="score"></strong></div><div class="checks" id="checks"></div><a class="download" id="download" href="#">下载 PPT</a></section>
  </section>
</main><script src="/static/page-transition.js?v=20260814-1"></script><script>
(() => { const input=document.querySelector('#file'),drop=document.querySelector('#drop'),name=document.querySelector('#name'),button=document.querySelector('#generate'),status=document.querySelector('#status'),result=document.querySelector('#result'),checks=document.querySelector('#checks'),score=document.querySelector('#score'),download=document.querySelector('#download'); let selected=null;
function set(file){ if(!file)return; if(!/^image\/(png|jpeg|webp)$/.test(file.type)){status.textContent='请选择 PNG、JPG、JPEG 或 WEBP 图片。';status.className='status error';return;} if(file.size>20*1024*1024){status.textContent='图片不能超过 20 MB。';status.className='status error';return;} selected=file;name.textContent=file.name;status.textContent='';status.className='status';button.disabled=false;result.hidden=true; }
input.addEventListener('change',()=>set(input.files[0])); ['dragenter','dragover'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('drag');})); ['dragleave','drop'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.remove('drag');})); drop.addEventListener('drop',event=>set(event.dataTransfer.files[0]));
button.addEventListener('click',async()=>{if(!selected)return;button.disabled=true;status.className='status';status.textContent='正在生成 PPT 并执行核验…';const body=new FormData();body.append('file',selected);try{const response=await fetch('/api/image-to-ppt/generate',{method:'POST',body});const data=await response.json();if(!response.ok)throw new Error(data.detail||'生成失败');const report=data.validation;score.textContent=`核验得分 ${report.score}/100`;score.className=`score ${report.ok?'':'warn'}`;checks.innerHTML=report.checks.map(item=>`<div class="check"><strong class="${item.passed?'pass':'fail'}">${item.passed?'通过':'未通过'} · ${escapeHtml(item.name)}</strong><span>${escapeHtml(item.detail)}</span></div>`).join('');download.href=data.download_url;download.hidden=!report.ok;result.hidden=false;status.textContent=report.ok?'PPT 已生成，核验通过。':'PPT 已生成，但核验未全部通过。';}catch(error){status.textContent=error.message||'生成失败';status.className='status error';}finally{button.disabled=false;}}); function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);}})();
</script></body></html>
