<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/static/page-transition.css?v=20260814-1"><title>报销单生成</title>
<style data-app-style="reimbursement">
:root{--ink:#181816;--muted:#77736b;--line:#d3cec4;--paper:#f8f6f1;--bg:#e8e4dc;--accent:#cf432d;--soft:#efebe3;--danger:#b9362d}*{box-sizing:border-box}body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(24,24,22,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(24,24,22,.025) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}body::before{content:"";position:fixed;inset:0 auto 0 0;width:7px;background:var(--accent);z-index:40}.shell{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:32px 0 68px}.top-nav{display:flex;gap:5px;padding:5px;margin-bottom:36px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.top-nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-size:13px;border-radius:5px;white-space:nowrap}.top-nav a:hover{color:var(--ink);background:#e8e3da}.top-nav a.is-active{color:var(--paper);background:var(--ink)}.hero{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;margin-bottom:22px}.mark{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--line);background:var(--soft);color:var(--accent);font-size:25px;border-radius:7px}h1{margin:0;font-size:27px;letter-spacing:0}.hero p{margin:5px 0 0;color:var(--muted);font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;border:1px solid var(--line);background:var(--paper)}.upload{min-height:332px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:34px;border-right:1px solid var(--line);text-align:center}.drop{width:100%;max-width:520px;padding:42px 24px;border:1.5px dashed #9b978f;background:#fffdf8;cursor:pointer}.drop:hover,.drop.drag{border-color:var(--accent);background:#fffaf3}.drop strong{display:block;font-size:16px}.drop span{display:block;margin-top:8px;color:var(--muted);font-size:13px}input{display:none}button{font:inherit;cursor:pointer}.primary{margin-top:17px;padding:10px 18px;border:0;border-radius:5px;background:var(--accent);color:#fff;font-size:14px;font-weight:700}.primary:disabled{opacity:.52;cursor:wait}.details{padding:25px}.details h2{margin:0 0 15px;font-size:15px}.details dl{margin:0}.details div{padding:12px 0;border-top:1px solid var(--line)}.details dt{color:var(--muted);font-size:12px}.details dd{margin:5px 0 0;font-size:13px;line-height:1.55}.status{min-height:22px;margin:16px 0 0;color:var(--muted);font-size:13px}.status.error{color:var(--danger)}.name{margin-top:13px;font-size:13px;word-break:break-all}.result{margin-top:18px;padding:16px 18px;border-left:3px solid var(--accent);background:var(--paper);font-size:14px}.result[hidden]{display:none}@media(max-width:720px){.shell{width:min(100% - 24px,1040px);padding-top:18px}.top-nav{overflow-x:auto;margin-bottom:26px}.workspace{grid-template-columns:1fr}.upload{min-height:285px;border-right:0;border-bottom:1px solid var(--line)}h1{font-size:23px}}
.shell{width:min(1080px,calc(100% - 48px));padding:54px 0 80px}.top-nav{gap:6px;margin-bottom:32px;border-color:var(--ink);border-radius:0;box-shadow:5px 5px 0 rgba(24,24,22,.08)}.top-nav a{border-radius:0;font-size:12px;font-weight:700;letter-spacing:.04em;transition:color .18s ease,background-color .18s ease,transform .14s cubic-bezier(.23,1,.32,1)}.top-nav a:active{transform:translateY(1px) scale(.985)}:root{--ease-out:cubic-bezier(.23,1,.32,1)}.primary{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:126px;transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out)}.primary:not(:disabled):active{transform:scale(.97)}.button-spinner{position:absolute;left:15px;width:14px;height:14px;opacity:0;transition:opacity 160ms var(--ease-out)}.button-spinner::after{content:"";display:block;width:100%;height:100%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:reimbursement-spin .8s linear infinite;animation-play-state:paused}.primary.is-loading{opacity:1}.primary.is-loading .button-spinner{opacity:1}.primary.is-loading .button-spinner::after{animation-play-state:running}@keyframes reimbursement-spin{to{transform:rotate(360deg)}}.job-progress{width:100%;max-width:520px;margin-top:18px;text-align:left}.job-progress[hidden]{display:none}.progress-meta{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--ink);font-size:13px}.progress-meta strong{font-variant-numeric:tabular-nums;font-size:12px}.progress-track{height:5px;margin-top:9px;overflow:hidden;background:#dfdad1}.progress-value{display:block;width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform 200ms linear}.progress-detail{min-height:18px;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}.job-progress.is-error .progress-meta,.job-progress.is-error .progress-detail{color:var(--danger)}.job-progress.is-error .progress-value{background:var(--danger)}@media(prefers-reduced-motion:reduce){.primary,.button-spinner{transition-duration:0ms}.button-spinner::after{animation-duration:1.6s}.progress-value{transition:none}}@media(max-width:720px){.shell{width:min(100% - 24px,1080px);padding:24px 0 80px}}
</style><style>
.top-nav{gap:6px;margin-bottom:32px;border-color:var(--ink);border-radius:0;box-shadow:5px 5px 0 rgba(24,24,22,.08)}
.top-nav a{border-radius:0;font-size:12px;font-weight:700;letter-spacing:.04em;transition:color .18s ease,background-color .18s ease,transform .14s cubic-bezier(.23,1,.32,1)}
.top-nav a:active{transform:translateY(1px) scale(.985)}
.shell{width:min(1080px,calc(100% - 48px));padding:54px 0 80px}
@media(max-width:720px){.shell{width:min(100% - 24px,1080px);padding:24px 0 80px}}
</style></head><body class="page-transition"><main class="shell"><nav class="top-nav" aria-label="业务模块"><a href="/">发票核验</a><a href="/jira">Jira 数据处理</a><a href="/weekly-report">周报生成</a><a class="is-active" href="/reimbursement">报销单生成</a></nav><section id="route-content" class="route-content"><header class="hero"><div class="mark" aria-hidden="true">￥</div><div><h1>报销单生成</h1><p>上传报销信息 DOCX，生成可打印、可检索的费用报销单 PDF。</p></div></header><section class="workspace"><div class="upload"><label class="drop" id="drop" for="file"><strong>选择报销信息 DOCX</strong><span>支持将文件拖放到这里，最大 50 MB</span></label><input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div class="name" id="name"></div><button class="primary" id="generate" disabled><span class="button-spinner" aria-hidden="true"></span><span id="generateLabel">生成 PDF</span></button><div class="job-progress" id="progress" hidden><div class="progress-meta"><span id="progressStage">等待开始</span><strong id="progressPercent">0%</strong></div><div class="progress-track" id="progressTrack" role="progressbar" aria-label="报销单生成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="progress-value" id="progressBar"></span></div><div class="progress-detail" id="progressDetail"></div></div><div class="status" id="status" role="status" aria-live="polite"></div></div><aside class="details"><h2>输出内容</h2><dl><div><dt>表单字段</dt><dd>报销人、部门、日期、报销编号与立项号。</dd></div><div><dt>报销明细</dt><dd>自动读取类型、用途和金额，超过四条时续页。</dd></div><div><dt>多张报销单</dt><dd>一个文档含多张报销单时，自动生成 ZIP 下载包。</dd></div><div><dt>数据处理</dt><dd>文件只在生成期间保存在临时目录。</dd></div></dl></aside></section><div class="result" id="result" hidden>PDF 已生成，下载将立即开始。</div></section></main><script src="/static/page-transition.js?v=20260901-1"></script><script>
(()=>{
  const input=document.querySelector('#file'),zone=document.querySelector('#drop'),name=document.querySelector('#name'),button=document.querySelector('#generate'),buttonLabel=document.querySelector('#generateLabel'),status=document.querySelector('#status'),result=document.querySelector('#result'),progressBox=document.querySelector('#progress'),progressStage=document.querySelector('#progressStage'),progressPercent=document.querySelector('#progressPercent'),progressTrack=document.querySelector('#progressTrack'),progressBar=document.querySelector('#progressBar'),progressDetail=document.querySelector('#progressDetail');
  let selected,busy=false;

  function setProgress(stage,percent,detail,state=''){
    const value=Math.max(0,Math.min(100,Number(percent)||0));
    progressBox.hidden=false;
    progressBox.className=`job-progress${state==='error'?' is-error':''}`;
    progressStage.textContent=stage||'处理中';
    progressPercent.textContent=`${value}%`;
    progressDetail.textContent=detail||'';
    progressTrack.setAttribute('aria-valuenow',String(value));
    progressBar.style.transform=`scaleX(${value/100})`;
  }

  function setLoading(active){
    busy=active;
    button.disabled=active||!selected;
    input.disabled=active;
    zone.setAttribute('aria-disabled',String(active));
    button.classList.toggle('is-loading',active);
    button.setAttribute('aria-busy',String(active));
    buttonLabel.textContent=active?'正在生成':'生成 PDF';
  }

  function set(file){
    if(!file||busy)return;
    if(!file.name.toLowerCase().endsWith('.docx')){
      status.textContent='请选择 DOCX 格式的报销信息文件。';
      status.className='status error';
      return;
    }
    selected=file;
    name.textContent=file.name;
    button.disabled=false;
    status.textContent='';
    status.className='status';
    result.hidden=true;
    progressBox.hidden=true;
  }

  function uploadJob(data){
    return new Promise((resolve,reject)=>{
      const request=new XMLHttpRequest();
      request.open('POST','/api/reimbursement/jobs');
      request.responseType='json';
      request.upload.addEventListener('progress',event=>{
        const percent=event.lengthComputable?Math.max(2,Math.round(event.loaded/event.total*10)):4;
        const total=event.lengthComputable?event.total:selected.size;
        setProgress('上传报销信息',percent,`已上传 ${formatBytes(event.loaded)} / ${formatBytes(total)}`);
      });
      request.addEventListener('load',()=>{
        const body=request.response||{};
        if(request.status>=200&&request.status<300)resolve(body);
        else reject(new Error(body.detail||request.statusText||'上传失败'));
      });
      request.addEventListener('error',()=>reject(new Error('网络连接中断，上传未完成')));
      request.send(data);
    });
  }

  async function waitForJob(jobId){
    while(true){
      const response=await fetch(`/api/reimbursement/jobs/${jobId}`,{cache:'no-store'});
      const body=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(body.detail||'无法读取生成进度');
      setProgress(body.progress?.stage,body.progress?.percent,body.progress?.detail,body.status==='error'?'error':'');
      if(body.status==='done')return body;
      if(body.status==='error')throw new Error(body.error||'生成失败');
      await new Promise(resolve=>setTimeout(resolve,400));
    }
  }

  function formatBytes(bytes){
    return bytes>=1048576?`${(bytes/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(bytes/1024))} KB`;
  }

  input.addEventListener('change',()=>set(input.files[0]));
  ['dragenter','dragover'].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();if(!busy)zone.classList.add('drag')}));
  ['dragleave','drop'].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.remove('drag')}));
  zone.addEventListener('drop',event=>set(event.dataTransfer.files[0]));
  button.addEventListener('click',async()=>{
    if(!selected||busy)return;
    setLoading(true);
    status.textContent='';
    status.className='status';
    result.hidden=true;
    setProgress('上传报销信息',1,'正在上传 DOCX 文件');
    const data=new FormData();
    data.append('file',selected);
    try{
      const created=await uploadJob(data);
      if(!created.job_id)throw new Error('服务器未返回生成任务编号');
      const completed=await waitForJob(created.job_id);
      const response=await fetch(completed.download_url,{cache:'no-store'});
      if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.detail||'下载生成文件失败')}
      const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');
      const disposition=response.headers.get('content-disposition')||'',filenameMatch=disposition.match(/filename\*=utf-8''([^;]+)/i);
      link.href=url;
      link.download=filenameMatch?decodeURIComponent(filenameMatch[1]):completed.count>1?'报销单.zip':'报销单.pdf';
      link.click();
      URL.revokeObjectURL(url);
      setProgress('生成完成',100,`${completed.count||1} 张报销单已通过整体核验`);
      result.textContent=completed.count>1?`已生成 ${completed.count} 张报销单，下载将立即开始。`:'PDF 已生成，整体核验通过，下载将立即开始。';
      result.hidden=false;
    }catch(error){
      setProgress('生成失败',100,error.message,'error');
      status.textContent=error.message;
      status.className='status error';
    }finally{
      setLoading(false);
    }
  });
})();
</script></body></html>
